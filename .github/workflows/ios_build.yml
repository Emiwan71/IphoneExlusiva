name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Compilar para iOS en Mac
    runs-on: macos-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar versión de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: 📦 Obtener dependencias del proyecto
        run: flutter pub get

      - name: 🏗️ Compilar app para iOS (Sin firma)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          zip -r Runner.zip Runner.app

      - name: 📤 Subir archivo ZIP como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-app
          path: build/ios/iphoneos/Runner.zip
